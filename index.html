<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b2440" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pooket Tabks" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Pooket Tabks</title>
  </head>
  <body data-phase="aiming">
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="players" class="top"></div>
      <div id="turn-banner" aria-live="polite"></div>
      <div id="heist" hidden aria-live="polite">
        <p class="heist-title"></p>
        <div class="heist-cards"></div>
        <p class="heist-result"></p>
      </div>
      <div id="coffee" hidden aria-live="polite">
        <p class="coffee-title"></p>
        <div class="coffee-dial" aria-hidden="true">
          <div id="coffee-wheel"></div>
          <div class="coffee-pointer"></div>
        </div>
        <p class="coffee-result"></p>
      </div>
      <div id="quiz" hidden aria-live="polite">
        <p class="quiz-title"></p>
        <p class="quiz-question"></p>
        <div class="quiz-answers" role="group" aria-label="Answers"></div>
        <p class="quiz-result"></p>
      </div>
      <div id="pokemon" hidden aria-live="polite">
        <p class="pokemon-title"></p>
        <div class="pokemon-body">
          <div class="pokemon-picture"><img alt="" referrerpolicy="no-referrer" /></div>
          <div class="pokemon-answers" role="group" aria-label="Names"></div>
        </div>
        <p class="pokemon-result"></p>
      </div>
      <div id="stratagems" hidden aria-live="polite">
        <p class="strat-title"></p>
        <div class="strat-body">
          <div class="strat-col"></div>
          <div class="strat-centre">
            <p class="strat-keyed" aria-label="Keyed so far"></p>
            <div class="strat-dpad" role="group" aria-label="D-pad">
              <button class="up" data-arrow="U" aria-label="Up">▲</button>
              <button class="left" data-arrow="L" aria-label="Left">◀</button>
              <button class="right" data-arrow="R" aria-label="Right">▶</button>
              <button class="down" data-arrow="D" aria-label="Down">▼</button>
            </div>
          </div>
          <div class="strat-col"></div>
        </div>
        <p class="strat-result"></p>
      </div>
      <div id="camera" hidden>
        <div class="cam-middle">
          <div class="cam-vf-box">
            <div class="cam-frame" id="camera-vf">
              <span class="cam-grade"></span>
              <span class="cam-tint"></span>
              <svg class="cam-grain" aria-hidden="true"><filter id="cam-grain-noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#cam-grain-noise)"></rect></svg>
              <span class="cam-thirds" aria-hidden="true"></span>
              <span class="cam-af" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
              <span class="cam-tag cam-scene"></span>
              <span class="cam-tag cam-left"></span>
              <span class="cam-live"></span>
              <span class="cam-blink"></span>
            </div>
          </div>
          <div class="cam-info" aria-live="off">
            <span class="cam-i-mode"></span><span class="cam-i-tv"></span><span class="cam-i-av"></span>
            <span class="cam-meter"><span class="cam-meter-scale">-2 · 1 · 0 · 1 · +2</span><i></i></span>
            <span class="cam-i-iso"></span><span class="cam-i-flash"></span><span class="cam-i-dot">●</span>
          </div>
          <p class="cam-help"></p>
        </div>
        <div class="cam-grip">
          <div class="cam-col">
            <button class="cam-mode" data-cam="mode" aria-label="Mode dial">
              <span class="cam-mode-ring"><span>P</span><span>Tv</span><span>Av</span><span>M</span></span>
              <span class="cam-mode-hub"></span>
            </button>
            <span class="cam-mode-mark" aria-hidden="true"></span>
            <div class="cam-buttons">
              <span class="cam-btn"><button data-cam="fn:wb" aria-label="White balance">☀</button>WB</span>
              <span class="cam-btn"><button data-cam="fn:iso" aria-label="ISO">◎</button>ISO</span>
              <span class="cam-btn"><button data-cam="flash" aria-label="Flash">ϟ</button>FLASH</span>
              <span class="cam-btn"><button data-cam="lens" class="cam-lens" aria-label="Swap lens"></button>LENS</span>
              <span class="cam-btn"><button data-cam="afmf" class="cam-afmf" aria-label="AF or MF"><span>AF</span><span>MF</span></button>AF / MF</span>
              <span class="cam-btn"><button data-cam="afon" aria-label="Focus on the centre point">✱</button>AF-ON</span>
            </div>
          </div>
          <div class="cam-col">
            <div class="cam-lcd">
              <p><span class="cam-l-tv"></span><span class="cam-l-av"></span></p>
              <p><span class="cam-l-iso"></span><span class="cam-l-wb"></span></p>
              <p><span class="cam-l-mode"></span><span class="cam-l-shots"></span></p>
            </div>
            <div class="cam-dial main" data-dial="main" role="slider" aria-label="Main dial" tabindex="0"><span>◀</span><span>▶</span></div>
            <small class="cam-dial-role main"></small>
            <button class="cam-shutter" data-cam="shutter" aria-label="Shutter"></button>
            <div class="cam-quick">
              <div class="cam-dial quick" data-dial="quick" role="slider" aria-label="Quick control dial" tabindex="0"></div>
              <button class="cam-set" data-cam="set" aria-label="Set">SET</button>
            </div>
            <small class="cam-dial-role quick"></small>
          </div>
          <div class="cam-ring">
            <span class="cam-ring-label">FOCUS<b></b></span>
            <span class="cam-ring-body">
              <span class="cam-ring-scale" aria-hidden="true"><i style="left:0%">.45m</i><i style="left:27.6%">2</i><i style="left:44.5%">5</i><i style="left:57.4%">10</i><i style="left:100%">∞</i></span>
              <input type="range" class="cam-ring-input" min="0" max="100" step="0.5" aria-label="Focus ring" />
            </span>
            <span class="cam-ring-note"></span>
          </div>
        </div>
        <div class="cam-playback" hidden>
          <p class="cam-pb-title"><b></b><span></span></p>
          <div class="cam-pb-rows"></div>
          <div class="cam-pb-damage"><b></b><span class="cam-pb-tags"></span></div>
          <p class="cam-pb-tip"></p>
          <div class="cam-pb-actions"><button data-cam="next" class="primary"></button><button data-cam="keep"></button></div>
        </div>
      </div>
      <div id="camera-showcase" class="cam-showcase" hidden></div>
      <div id="camera-print" hidden aria-live="polite"><b></b><span></span></div>
      <div class="top-mid">
        <button id="info-open" aria-label="Info: how to play and weapons">i</button>
        <button id="sound-toggle" aria-label="Sound" aria-pressed="true">🔊</button>
        <button id="spectate-leave" aria-label="Stop watching">👁 Watching · Leave</button>
        <button id="replay-speed" aria-label="Replay speed">1×</button>
        <button id="net-menu" aria-label="Game menu">☰</button>
        <button id="watchers" aria-label="Who's watching" aria-expanded="false" hidden>👁 0</button>
      </div>
      <div id="watchers-list" hidden></div>

      <div class="pad left">
        <button id="aim-switch" aria-label="Which tank you're aiming" hidden>🎯 Main tank</button>
        <div class="control">
          <button data-adjust="1,0" aria-label="Rotate barrel anticlockwise">↺</button>
          <div class="readout"><small>ANGLE</small><span id="angle">45°</span></div>
          <button data-adjust="-1,0" aria-label="Rotate barrel clockwise">↻</button>
        </div>
        <div class="control">
          <button data-adjust="0,-1" aria-label="Less power">−</button>
          <div class="readout"><small>POWER</small><span id="power">60</span></div>
          <button data-adjust="0,1" aria-label="More power">+</button>
        </div>
      </div>

      <div class="pad right">
        <div id="weapons" role="group" aria-label="Weapon"></div>
        <button id="fire">FIRE</button>
      </div>

      <div class="drive" role="group" aria-label="Drive">
        <button data-drive="-1" aria-label="Drive left">◀</button>
        <div class="fuel" aria-label="Fuel">
          <small>FUEL</small>
          <span class="gauge"><span id="fuel-fill"></span></span>
        </div>
        <button data-drive="1" aria-label="Drive right">▶</button>
      </div>

      <p class="hint" id="hint">Drag &amp; pull back to aim</p>
    </div>

    <div id="setup" class="overlay">
      <h1>Pooket Tabks</h1>
      <p class="you">Playing as <b id="you-name"></b><span id="you-rank"></span> <button id="you-change">✎ Change</button></p>
      <p id="unlock-all" class="unlock-all-note" hidden>🧪 Testing: every character unlocked online</p>
      <div class="choices">
        <button id="open-browser" class="choice primary">
          <span id="turns-dot" class="dot" hidden></span>
          <span class="icon">🌐</span>
          <span class="label">Game browser</span>
          <span class="sub">Host, join or watch online</span>
          <span id="browser-counts" class="badge" hidden></span>
        </button>
        <button id="open-hotseat" class="choice">
          <span class="icon">👥</span>
          <span class="label">Local hotseat</span>
          <span class="sub">Two players, one phone</span>
        </button>
      </div>
      <div class="setup-actions minor">
        <button id="setup-info">ⓘ Weapons &amp; how to play</button>
        <button id="setup-stats">📊 Stats</button>
        <button id="setup-whatsnew">✨ What’s new</button>
        <button id="notify" aria-pressed="false" hidden>🔔 Notifications</button>
      </div>
      <div id="account" class="account" hidden></div>
      <p id="notify-note" class="notify-note" hidden></p>
      <p id="build-info" class="build-info"></p>
    </div>

    <div id="hotseat" class="overlay" hidden>
      <div class="screen-top">
        <button id="hotseat-back" class="back">‹ Back</button>
        <h2>Local hotseat</h2>
        <span class="screen-note">Two players, one phone</span>
      </div>
      <div id="setup-players"></div>
      <div class="setup-actions">
        <button id="hotseat-info">ⓘ Weapons</button>
        <button id="start" class="big">Start battle</button>
      </div>
    </div>

    <div id="gameover" class="overlay" hidden>
      <h1 id="winner"></h1>
      <div class="setup-actions">
        <button id="gameover-leave">New game</button>
        <button id="watch-replay" class="big">▶ Watch replay</button>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite" hidden></div>

    <div id="rotate" class="overlay">
      <div class="phone-icon"></div>
      <p>Rotate your phone to landscape</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
