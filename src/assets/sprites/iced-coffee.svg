<svg xmlns="http://www.w3.org/2000/svg" width="32" height="48" viewBox="0 0 32 48">
  <!-- Upright (not a projectile): Diced Coffee's drink, held by the tank. The coffee level is drawn as is. -->
  <defs>
    <clipPath id="cup">
      <path d="M5 16 L27 16 L24 46 L8 46 Z"/>
    </clipPath>
  </defs>
  <!-- straw -->
  <path d="M19 17 L23 1 L27 1.6" fill="none" stroke="#2fbf71" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the cup: clear plastic, coffee with a swirl of milk, ice -->
  <path d="M5 16 L27 16 L24 46 L8 46 Z" fill="#e9f6ff" fill-opacity="0.55"/>
  <g clip-path="url(#cup)">
    <rect x="0" y="21" width="32" height="27" fill="#7a4a24"/>
    <path d="M4 25 q6 -3 12 0 t12 0 v4 q-6 3 -12 0 t-12 0 Z" fill="#c99a6b"/>
    <path d="M4 33 q6 -2 12 0 t12 0" fill="none" stroke="#a87449" stroke-width="2"/>
    <rect x="8" y="18" width="7" height="7" rx="1.5" fill="#f4fbff" fill-opacity="0.85" transform="rotate(-12 11.5 21.5)"/>
    <rect x="16" y="20" width="6.5" height="6.5" rx="1.5" fill="#f4fbff" fill-opacity="0.8" transform="rotate(14 19 23)"/>
    <rect x="11" y="28" width="6" height="6" rx="1.5" fill="#f4fbff" fill-opacity="0.5" transform="rotate(8 14 31)"/>
  </g>
  <path d="M5 16 L27 16 L24 46 L8 46 Z" fill="none" stroke="#8fb3c9" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M8.5 20 L10.5 42" stroke="#fff" stroke-opacity="0.75" stroke-width="1.6" stroke-linecap="round"/>
  <!-- dome lid -->
  <path d="M3.5 16 h25 a1.5 1.5 0 0 0 0 -3 h-25 a1.5 1.5 0 0 0 0 3 Z" fill="#f4fbff" stroke="#8fb3c9" stroke-width="1.2"/>
  <path d="M7 13 q9 -7 18 0" fill="#f4fbff" fill-opacity="0.7" stroke="#8fb3c9" stroke-width="1.2"/>
</svg>
