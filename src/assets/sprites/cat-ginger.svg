<svg xmlns="http://www.w3.org/2000/svg" width="36" height="22" viewBox="0 0 36 22">
  <!-- A small ginger cat curled up asleep, side-on, head resting on its paws, facing right (+x); sits on the bottom edge. -->
  <!-- tail, wrapped round the front -->
  <path d="M5 15 C0.5 17 2 21 9 21 L22 20.6" fill="none" stroke="#3a2a1c" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M5 15 C0.5 17 2 21 9 21 L22 20.6" fill="none" stroke="#f2a04e" stroke-width="2.6" stroke-linecap="round"/>
  <!-- body -->
  <path d="M3.5 15.5 C3.5 9 9 6.5 16 6.5 C22 6.5 26 9 26.5 14 L26.5 19.5 C20 20.8 9 20.8 5.5 19.5 C4 18.6 3.5 17.2 3.5 15.5 Z" fill="#f2a04e" stroke="#3a2a1c" stroke-width="1"/>
  <!-- stripes -->
  <g fill="none" stroke="#c7671b" stroke-width="1.3" stroke-linecap="round">
    <path d="M9 8.6 C9.8 10 10 11.2 9.8 12.4"/>
    <path d="M13.5 7.3 C14.4 8.8 14.6 10.2 14.4 11.6"/>
    <path d="M18 7.4 C18.8 8.8 19 10.2 18.8 11.4"/>
  </g>
  <!-- front paws -->
  <ellipse cx="27.5" cy="19.8" rx="3.6" ry="1.6" fill="#fff1dc" stroke="#3a2a1c" stroke-width="0.8"/>
  <!-- head -->
  <path d="M22.5 8.6 L23.2 3.2 L26.6 6.4 Z" fill="#f2a04e" stroke="#3a2a1c" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M28.6 6.2 L32 3 L32.6 8.6 Z" fill="#f2a04e" stroke="#3a2a1c" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M23.6 6.9 L23.9 4.6 L25.4 6.1 Z M29.6 6.3 L31.5 4.5 L31.7 7.2 Z" fill="#f4a3b4"/>
  <ellipse cx="27.6" cy="12.6" rx="6.2" ry="5.4" fill="#f2a04e" stroke="#3a2a1c" stroke-width="1"/>
  <ellipse cx="28.4" cy="15" rx="3.2" ry="2" fill="#fff1dc"/>
  <!-- closed eyes, nose -->
  <g fill="none" stroke="#3a2a1c" stroke-width="0.9" stroke-linecap="round">
    <path d="M24.4 12.2 Q25.6 13.3 26.8 12.2"/>
    <path d="M29.2 12.2 Q30.4 13.3 31.6 12.2"/>
  </g>
  <path d="M27.4 14.2 L28.8 14.2 L28.1 15 Z" fill="#e87990"/>
</svg>
