<svg xmlns="http://www.w3.org/2000/svg" width="64" height="56" viewBox="0 0 64 56">
  <!-- Laughing kookaburra, perched, facing right. -->
  <!-- branch -->
  <path d="M4 50 C20 47 40 48 60 46" fill="none" stroke="#5a3b1e" stroke-width="3.2" stroke-linecap="round"/>
  <!-- barred rufous tail -->
  <path d="M14 36 L5 53 L12 54 L20 40 Z" fill="#b5652b" stroke="#3a2412" stroke-width="1"/>
  <path d="M9.5 45 L15 46 M7.6 49 L13.4 50 M11.5 41 L17 42" stroke="#3a2412" stroke-width="1.1"/>
  <!-- body / wing -->
  <path d="M14 36 C12 24 20 16 30 16 C38 16 42 22 42 30 C42 40 36 47 27 47 C20 47 15 43 14 36 Z" fill="#6b4a2c" stroke="#2e1d0f" stroke-width="1.2"/>
  <!-- cream breast -->
  <path d="M30 22 C38 22 42 28 41 34 C40 41 35 46 28 46 C31 40 32 30 30 22 Z" fill="#efe5cf"/>
  <!-- blue wing speckles -->
  <g fill="#5fa8d3">
    <circle cx="20" cy="28" r="1.4"/><circle cx="23.5" cy="31" r="1.4"/><circle cx="19" cy="33" r="1.3"/>
    <circle cx="24" cy="26" r="1.2"/><circle cx="22" cy="36" r="1.2"/>
  </g>
  <!-- feet -->
  <path d="M26 46 L25 50 M31 46 L32 49.5" stroke="#8a7a60" stroke-width="1.8" stroke-linecap="round"/>
  <!-- head -->
  <path d="M28 18 C27 9 34 4 41 5 C47 6 50 11 49 16 C48 22 42 25 36 24 C31 23.5 28.5 21.5 28 18 Z" fill="#f4ecd9" stroke="#2e1d0f" stroke-width="1.2"/>
  <!-- dark crown -->
  <path d="M30 12 C32 6.5 39 4.2 44 5.8 C40 7 35 9 33 13.5 Z" fill="#6b4a2c"/>
  <!-- eye stripe -->
  <path d="M31 16 C35 15.5 39 14.8 44 13.4 L44.5 15.4 C39.5 16.8 35 17.6 31.5 17.8 Z" fill="#4a3220"/>
  <circle cx="41" cy="14" r="1.8" fill="#1a1208"/>
  <circle cx="41.6" cy="13.4" r="0.55" fill="#fff"/>
  <!-- big beak: dark upper, pale lower -->
  <path d="M47 13.5 L62 17 L47.5 17.8 Z" fill="#2b2622" stroke="#15110e" stroke-width="0.7"/>
  <path d="M47.5 17.8 L61 17.4 L48 20.5 Z" fill="#d8c9a8" stroke="#6b5e47" stroke-width="0.6"/>
</svg>
