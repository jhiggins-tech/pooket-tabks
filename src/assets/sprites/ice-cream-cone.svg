<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" viewBox="0 0 64 32">
  <!-- Points right (+x): the renderer rotates it along the flight path, tip first. -->
  <defs>
    <clipPath id="cone">
      <path d="M24 6 L62 16 L24 26 Z"/>
    </clipPath>
  </defs>
  <path d="M24 6 L62 16 L24 26 Z" fill="#e3a857"/>
  <g clip-path="url(#cone)" stroke="#b97a2e" stroke-width="1.6">
    <path d="M20 0 L52 32 M28 0 L60 32 M36 0 L68 32 M20 32 L52 0 M28 32 L60 0 M36 32 L68 0"/>
  </g>
  <path d="M24 6 L62 16 L24 26 Z" fill="none" stroke="#8a5a24" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- scoop with drips over the rim -->
  <circle cx="16" cy="16" r="12" fill="#ffb3c7"/>
  <circle cx="26" cy="8.5" r="3.4" fill="#ffb3c7"/>
  <circle cx="27.5" cy="15" r="3" fill="#ffb3c7"/>
  <circle cx="26" cy="22.5" r="3.6" fill="#ffb3c7"/>
  <path d="M8 8 a11 11 0 0 1 10 -3" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="12" fill="none" stroke="#d9728f" stroke-width="1.4"/>
  <!-- sprinkles + cherry -->
  <g stroke-width="1.8" stroke-linecap="round">
    <path d="M12 12 l2 -1" stroke="#4ea8ff"/>
    <path d="M18 20 l2 1" stroke="#46d27a"/>
    <path d="M10 20 l1 2" stroke="#ffc53d"/>
    <path d="M20 11 l1 -2" stroke="#c77dff"/>
  </g>
  <circle cx="5.5" cy="16" r="4" fill="#e0263a"/>
  <circle cx="4.3" cy="14.6" r="1.1" fill="#fff" fill-opacity="0.7"/>
</svg>
